<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B2733">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Torre Jefferson">
<title>Torre Jefferson</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
<script>
(function(){try{var m=localStorage.getItem('tj-mode')||'auto',t=localStorage.getItem('tj-theme')||'mar';
var d=m==='dark'||(m==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.dataset.mode=d?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
</head>
<body>
<div id="app"><div class="loading">Cargando…</div></div>
<div id="layer"></div>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
</body>
</html>
